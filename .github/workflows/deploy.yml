name: CI/CD app3

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build app3 JAR
        run: ./mvnw clean package

      - name: Run tests
        run: ./mvnw test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy JAR to server and restart
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/deploy/app3
            cp /home/runner/work/app3/app3/target/app3-0.0.1-SNAPSHOT.jar ~/deploy/app3/
            sudo systemctl restart app3