name: CI/CD app3

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test with Maven
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app3-jar
          path: target/*.jar

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app3-jar

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*.jar"
          target: "/home/miti/my_apps/app3"
          strip_components: 0

      - name: Restart app3 and reload nginx
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "📦 Stop app3 if running"
            pkill -f 'java -jar /home/miti/my_apps/app3/*.jar' || true

            echo "📦 Start app3"
            nohup java -jar /home/miti/my_apps/app3/*.jar > /home/miti/my_apps/app3/app3.log 2>&1 &

            echo "🔧 Test nginx config"
            sudo nginx -t

            echo "🔄 Reload nginx"
            sudo systemctl reload nginx

            echo "✅ Deploy completato!"
